<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handstart Digital — Coming soon</title>
  <meta name="description" content="Handstart Digital — coming soon." />
  <meta name="robots" content="noindex" />

  <!-- Brand fonts: Playfair Display (display) + Lato (body).
       Remove this line if you'd rather keep the page dependency-free;
       the fallbacks below will take over. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:  #1B2B4B;
      --amber: #C8873A;
      --cream: #F7F4EE;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--cream);
      color: var(--navy);
      font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---- Nav bar (wordmark only; otherwise empty) ---- */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.75rem 2rem;
      border-bottom: 1px solid rgba(27, 43, 75, 0.12);
    }

    .wordmark {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--navy);
    }

    /* ---- Center stage ---- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--navy);
      animation: rise 0.9s ease both;
    }

    /* The one accent: the trailing dot in amber. */
    h1 .dot { color: var(--amber); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }

    /* ---- Optional contact line ----
       Uncomment the <p> in the markup below if you want a way to be reached
       while the site is dark. Styling is ready. -->
    .contact {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .contact a { color: var(--amber); text-decoration: none; }
    .contact a:hover,
    .contact a:focus-visible { text-decoration: underline; }
    */
  </style>
</head>
<body>
  <nav>
    <span class="wordmark">Handstart Digital</span>
    <!-- right side intentionally empty -->
  </nav>

  <main>
    <div>
      <h1>Coming soon<span class="dot">.</span></h1>

      <!-- Optional: uncomment to show a contact line.
      <p class="contact">In the meantime — <a href="mailto:contact@handstartdigital.com">contact@handstartdigital.com</a></p>
      -->
    </div>
  </main>
</body>
</html>
